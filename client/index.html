<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Primary SEO -->
    <title>Fincai — Agentic AI Trading Assistant for Stocks &amp; Options</title>

      name="description"
      content="Fincai is an agentic AI trading assistant that analyzes stocks and options in real time, runs autonomous trading strategies (paper by default), and executes manual trades on your confirmation."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Favicons -->

    <!-- Open Graph / Facebook / iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fincai.ai/" />
    <meta property="og:title" content="Fincai — Agentic AI Trading Assistant for Stocks &amp; Options" />

      property="og:description"
      content="An agentic AI that analyzes markets with a multi-agent system, runs autonomous strategies (paper by default), and places manual stock &amp; options trades on your confirmation."

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fincai",
      "url": "https://fincai.ai",
      "logo": "https://fincai.ai/logo.jpeg",
      "description": "Fincai is an agentic AI trading assistant for stocks and options.",
      "sameAs": ["https://twitter.com/fincai"]
    }
    </script>

    <!-- Structured data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Fincai",
      "url": "https://fincai.ai",
      "description": "Agentic AI trading assistant for stocks and options."
    }
    </script>

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Fincai",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "url": "https://fincai.ai",
      "description": "Fincai is an agentic AI trading assistant that analyzes stocks and options with a multi-agent AI system (technical, sentiment, and fundamental agents plus bull/bear debate), runs autonomous trading strategies (paper by default), and executes manual equity trades through a connected brokerage on your confirmation.",
      "featureList": [
        "Agentic AI trading agent for stocks and options",
        "Multi-agent market analysis with bull/bear debate",
        "Autonomous strategy runner with stop-loss, profit-target and trailing stops",
        "Conversational AI chat for market analysis and trade execution",
        "Options pricing engine with full Greeks (Black-Scholes and Bjerksund-Stensland)",
        "Real-time market data and live charts"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Structured data: FAQ (agentic AI trading) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is agentic AI trading?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Agentic AI trading uses an autonomous AI agent that can analyze markets, form a plan, and take actions such as placing or closing trades on your behalf — instead of only answering questions. Fincai is an agentic AI trading assistant: it reasons over live stock and options data, runs strategies automatically (paper by default), and can execute manual equity trades through a connected brokerage after you confirm."
          }
        },
        {
          "@type": "Question",
          "name": "Can AI trade stocks for me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Fincai connects an AI agent to a live brokerage (Robinhood via its Trading MCP) so it can place and manage real equity trades. Manual trades require your explicit confirmation, and its autonomous strategy runner defaults to paper (simulated) trading, with live trading as an explicit per-strategy opt-in."
          }
        },
        {
          "@type": "Question",
          "name": "What is Fincai?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fincai is an AI-powered trading assistant for stocks and options. It combines a conversational AI chat, a multi-agent analysis system, an options pricing engine, and an autonomous strategy runner that can trade through a connected brokerage."
          }
        },
        {
          "@type": "Question",
          "name": "Is Fincai free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fincai offers a free demo mode that works without an account, including live market data and AI analysis. Connecting a brokerage for live trading requires signing in."
          }
        },
        {
          "@type": "Question",
          "name": "Does Fincai give personalized financial advice?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Fincai provides market analysis, tools, and trade execution assistance for informational purposes only. It does not provide personalized financial or investment advice, and trading involves risk."
          }
        },
        {
          "@type": "Question",
          "name": "Is there an AI bot for Robinhood?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Fincai is an agentic AI trading assistant that connects to your Robinhood account through Robinhood's official Trading API using secure OAuth. It analyzes stocks and options in real time and can place manual equity trades on your confirmation."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use AI to trade stocks on Robinhood?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Once you authorize Fincai with Robinhood, its AI agent can place and manage real equity trades. Manual trades require your explicit confirmation, and autonomous strategies run in paper (simulated) mode until you opt a strategy into live trading."
          }
        },
        {
          "@type": "Question",
          "name": "Does Fincai need my Robinhood password?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. You sign in on Robinhood's own OAuth page, not inside Fincai. Fincai uses OAuth 2.1 with PKCE and never sees or stores your Robinhood username or password. You can disconnect at any time."
          }
        },
        {
          "@type": "Question",
          "name": "Is Fincai affiliated with Robinhood?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Fincai is an independent product and is not affiliated with, endorsed by, or sponsored by Robinhood Markets, Inc. It connects only through Robinhood's official Trading API using secure OAuth authorization."
          }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
